# Centroid analysis and manuscript trimmed rank-biserial test.
# Relative paths resolve from the YAML directory.
workflow: centroid
paths:
  seurat: inputs/response_revised_RA_seurat_object.rds
  centroids: resources/centroids_top7000.tsv
  cytokine_degs: inputs/DEGs.csv
  output: outputs/centroid
columns:
  patient: Sample_Name
  celltype: scvi_fine_CT
  response: Response_Final
labels:
  R: Good
  NR: Bad
centroid:
  source: frozen
  IFNa:
  - IFN-alpha1
  IFNg:
  - IFN-gamma
  adjusted_p_cutoff: 0.05
  top_n: 7000
  minimum_cells: 10
  minimum_shared_genes: 10
  expression_aggregation: mean_RNA_data
  weights: mean_log_fc
  positive_logfc_filter: false
  zscore: false
statistics:
  group_comparison: true
  group_test: ks_two_sided_R_default_exact
  expected_patients: 15
  expected_R: 8
  expected_NR: 7
  permutations: 6435
  permutation_type: complete_enumeration_no_plus_one
  seed: null
  p_adjust: none
  rank_biserial_permutation: true
plot:
  colors:
  - '#E41A1C'
  - '#377EB8'
  bins: 30
rank_biserial:
  framework: available_all_celltypes
  trim_fraction: 0.1
  alternative: greater
  expected_celltypes: 23
  expected_observed_evaluable: 23
  expected_trimmed_each_tail: 2
  permutations_with_23_celltypes: 5940
  permutations_with_22_celltypes: 495
  comparison_tolerance: 1.4901161193847656e-08
  ties: average_ranks_half_credit_probability
